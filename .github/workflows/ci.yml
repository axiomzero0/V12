name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  debug:
    name: Debug + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake
      - name: Build (debug)
        run: ./scripts/build.sh debug
      - name: Run tests
        run: ./build/bin/test_runner

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++
      - name: Build (ASan+UBSan)
        run: ./scripts/build.sh asan
      - name: Run tests under ASan+UBSan
        run: ./build/bin/test_runner
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:abort_on_error=1

  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++
      - name: Build (release)
        run: ./scripts/build.sh release
      - name: Run tests
        run: ./build/bin/test_runner

  clang:
    name: Clang Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Build with Clang
        run: CXX=clang++ ./scripts/build.sh debug
      - name: Run tests
        run: ./build/bin/test_runner
